<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skymyst — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --olive: #5c6b48;
      --olive-dark: #2c3822;
      --cream-card: rgba(246, 244, 234, 0.52);
      --cream-text: #2d3822;
      --tan-input: rgba(255, 255, 255, 0.88);
      --gold: #eeb35c;
      --gold-dark: #e2a24a;
      --heron: #a9b0aa;
      --heron-line: #5c6b48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
      background-image: url('bg.png');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Light ambient vignette so background photo stays bright & clearly visible */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.32));
      z-index: 0;
      pointer-events: none;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 760px;
      z-index: 1;
    }

    .card {
      position: relative;
      background: var(--cream-card);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      backdrop-filter: blur(12px) saturate(115%);
      -webkit-backdrop-filter: blur(12px) saturate(115%);
      overflow: hidden;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .sunburst {
      position: absolute;
      top: -60px;
      left: -60px;
      width: 300px;
      height: 300px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.8;
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 50px 36px 0;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 24px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--olive-dark);
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .brand-sub {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--olive);
      font-weight: 600;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-style: italic;
      font-size: clamp(34px, 4.8vw, 56px);
      line-height: 1.12;
      color: var(--olive-dark);
      letter-spacing: -0.01em;
    }

    h1 .dot {
      color: var(--gold-dark);
      font-style: normal;
    }

    .lede {
      max-width: 500px;
      margin: 18px auto 0;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--cream-text);
      font-weight: 500;
    }

    .form-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 28px auto 0;
      max-width: 480px;
      flex-wrap: wrap;
    }

    .email-input {
      flex: 1;
      min-width: 220px;
      height: 50px;
      border-radius: 25px;
      border: 1px solid rgba(92, 107, 72, 0.4);
      background: var(--tan-input);
      padding: 0 22px;
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      color: var(--olive-dark);
      outline: none;
      transition: box-shadow .2s ease, border-color .2s ease;
    }

    .email-input::placeholder {
      color: #7a826e;
    }

    .email-input:focus {
      box-shadow: 0 0 0 3px rgba(238, 179, 92, 0.45);
      border-color: var(--gold-dark);
    }

    .subscribe-btn {
      height: 50px;
      padding: 0 30px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      color: #3b250c;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(226, 162, 74, 0.35);
    }

    .subscribe-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(226, 162, 74, 0.45);
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--olive-dark);
      font-weight: 600;
    }

    .launch-tag {
      margin-top: 22px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--olive-dark);
      display: block;
      text-align: center;
    }

    .launch-tag .sparkle {
      color: var(--gold-dark);
      margin: 0 10px;
    }

    /* scene */
    .scene {
      position: relative;
      z-index: 1;
      height: 165px;
      margin-top: 20px;
      overflow: hidden;
    }

    .trees-row {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px;
      z-index: 2;
      opacity: 0.95;
    }

    .trees-left,
    .trees-right {
      display: flex;
      align-items: flex-end;
      gap: -10px;
    }

    .herons {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: 180px;
      pointer-events: none;
    }

    .border-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      z-index: 1;
    }

    @media (max-width:640px) {
      .content {
        padding: 36px 20px 0;
      }

      .form-row {
        flex-direction: column;
      }

      .email-input,
      .subscribe-btn {
        width: 100%;
      }

      .herons {
        gap: 80px;
        bottom: 12px;
      }

      .scene {
        height: 140px;
      }
    }
  </style>
</head>

<body>

  <div class="stage">
    <div class="card">

      <!-- sun burst -->
      <svg class="sunburst" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#f6e2ab" stroke-width="4" stroke-linecap="round">
          <line x1="150" y1="150" x2="150" y2="10" opacity="0.9" />
          <line x1="150" y1="150" x2="240" y2="35" opacity="0.8" />
          <line x1="150" y1="150" x2="60" y2="35" opacity="0.8" />
          <line x1="150" y1="150" x2="15" y2="90" opacity="0.7" />
          <line x1="150" y1="150" x2="15" y2="160" opacity="0.6" />
          <line x1="150" y1="150" x2="30" y2="220" opacity="0.5" />
          <line x1="150" y1="150" x2="200" y2="15" opacity="0.55" />
          <line x1="150" y1="150" x2="95" y2="10" opacity="0.55" />
          <line x1="150" y1="150" x2="40" y2="55" opacity="0.5" />
        </g>
        <circle cx="150" cy="150" r="50" fill="none" stroke="#f6e2ab" stroke-width="4" />
      </svg>

      <div class="content">

        <div class="brand">
          <span class="brand-name">Skymyst</span><span class="brand-sub">.COM</span>
        </div>

        <h1>The Next Big Shift<br>Is&nbsp;Loading<span class="dot">…</span></h1>

        <p class="lede">Subscribe to be the first to know when we launch and get early access before anyone else!</p>

        <form class="form-row" id="subscribeForm">
          <input type="email" class="email-input" placeholder="Please enter your email address" required
            autocomplete="email">
          <button type="submit" class="subscribe-btn">Subscribe</button>
        </form>
        <div class="status" id="statusMsg"></div>
        <div class="launch-tag"><span class="sparkle"></span>LAUNCHING SOON<span class="sparkle"></span></div>
      </div>

      <!-- pine forest + herons + organic landscape footer -->
      <div class="scene">

        <div class="trees-row">
          <div class="trees-left">
            <svg width="55" height="135" viewBox="0 0 60 150">
              <g fill="#5c6b48" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
            <svg width="44" height="110" viewBox="0 0 60 150" style="margin-left:-12px">
              <g fill="#4d5a3d" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
            <svg width="60" height="150" viewBox="0 0 60 150" style="margin-left:-14px">
              <g fill="#5c6b48" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
            <svg width="38" height="95" viewBox="0 0 60 150" style="margin-left:-10px">
              <g fill="#4d5a3d" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
          </div>
          <div class="trees-right">
            <svg width="38" height="95" viewBox="0 0 60 150">
              <g fill="#4d5a3d" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
            <svg width="60" height="150" viewBox="0 0 60 150" style="margin-left:-10px">
              <g fill="#5c6b48" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
            <svg width="44" height="110" viewBox="0 0 60 150" style="margin-left:-14px">
              <g fill="#4d5a3d" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
            <svg width="55" height="135" viewBox="0 0 60 150" style="margin-left:-12px">
              <g fill="#5c6b48" stroke="#3f4a32" stroke-width="1.8">
                <path
                  d="M30 5 L44 45 L36 45 L48 78 L38 78 L52 112 L34 112 L34 148 L26 148 L26 112 L8 112 L22 78 L12 78 L24 45 L16 45 Z" />
              </g>
            </svg>
          </div>
        </div>

        <div class="herons">
          <svg width="46" height="75" viewBox="0 0 54 90" fill="none">
            <path d="M27 8 C22 12 20 18 24 24 C18 28 12 24 8 18" stroke="#5c6b48" stroke-width="2" fill="none" />
            <ellipse cx="30" cy="34" rx="9" ry="16" fill="#c3cbbd" stroke="#5c6b48" stroke-width="1.6" />
            <path d="M24 22 C20 16 20 10 26 8 C30 7 33 9 33 12 C33 15 30 16 27 15" fill="#c3cbbd" stroke="#5c6b48"
              stroke-width="1.6" />
            <path d="M33 11 L42 9" stroke="#e2a24a" stroke-width="2" stroke-linecap="round" />
            <circle cx="30" cy="10" r="1.3" fill="#2c3822" />
            <path d="M27 48 L24 82 M32 48 L34 82" stroke="#3f4a32" stroke-width="2" stroke-linecap="round" />
            <path d="M20 82 L25 82 M31 82 L36 82" stroke="#3f4a32" stroke-width="2" stroke-linecap="round" />
          </svg>
          <svg width="40" height="68" viewBox="0 0 54 90" fill="none">
            <path d="M27 8 C22 12 20 18 24 24 C18 28 12 24 8 18" stroke="#5c6b48" stroke-width="2" fill="none" />
            <ellipse cx="30" cy="34" rx="9" ry="16" fill="#c3cbbd" stroke="#5c6b48" stroke-width="1.6" />
            <path d="M24 22 C20 16 20 10 26 8 C30 7 33 9 33 12 C33 15 30 16 27 15" fill="#c3cbbd" stroke="#5c6b48"
              stroke-width="1.6" />
            <path d="M33 11 L42 9" stroke="#e2a24a" stroke-width="2" stroke-linecap="round" />
            <circle cx="30" cy="10" r="1.3" fill="#2c3822" />
            <path d="M27 48 L24 82 M32 48 L34 82" stroke="#3f4a32" stroke-width="2" stroke-linecap="round" />
            <path d="M20 82 L25 82 M31 82 L36 82" stroke="#3f4a32" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>

        <!-- Organic smooth landscape wave ground -->
        <svg class="border-wave" viewBox="0 0 760 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 30 Q 190 15, 380 25 T 760 20 L 760 60 L 0 60 Z" fill="#5c6b48" opacity="0.3" />
          <path d="M0 38 Q 190 22, 380 32 T 760 28 L 760 60 L 0 60 Z" fill="#eeb35c" opacity="0.85" />
          <path d="M0 45 Q 190 35, 380 42 T 760 38 L 760 60 L 0 60 Z" fill="#3f4a32" opacity="0.6" />
        </svg>

      </div>

    </div>
  </div>

  <script>
    document.getElementById('subscribeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = this.querySelector('.email-input');
      var status = document.getElementById('statusMsg');
      if (input.checkValidity() && input.value.trim() !== '') {
        status.textContent = "You're on the list — thanks for subscribing!";
        input.value = '';
      } else {
        status.textContent = 'Please enter a valid email address.';
      }
    });
  </script>

</body>

</html>
