<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skymyst — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background-color: #000;
    }

    /* Background Video */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Subtle Overlay gradient for readability */
    .video-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.65));
      z-index: 1;
      pointer-events: none;
    }

    /* Direct Typography Container on top of Video */
    .hero-container {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: clamp(24px, 3vw, 36px);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 20px;
      color: #f6e2ab;
      opacity: 0.95;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-style: italic;
      font-size: clamp(38px, 6vw, 76px);
      line-height: 1.1;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    h1 span.dot {
      color: #eeb35c;
      font-style: normal;
    }

    .subtitle {
      max-width: 650px;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 400;
      line-height: 1.5;
      color: #e2e8f0;
      margin: 0 auto 30px;
      letter-spacing: 0.02em;
    }

    .launch-tag {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(16px, 1.8vw, 20px);
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #eeb35c;
      border: 1px solid rgba(238, 179, 92, 0.4);
      padding: 8px 24px;
      border-radius: 50px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>

<body>

  <video class="bg-video" autoplay loop muted playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>

  <div class="hero-container">
    <div class="brand-name">Skymyst.com</div>
    <h1>The Next Big Shift<br>Is Loading<span class="dot">…</span></h1>
    <p class="subtitle">Oops. The page is still getting its glow-up.<br>Our developers said "soon".</p>
    <div class="launch-tag">Launching Soon</div>
  </div>

</body>

</html>
